# Ubicación en el repositorio: .github/workflows/recolectar.yml
# Le dice a GitHub CUÁNDO y CÓMO ejecutar los recolectores en sus servidores.
name: Recolectar datos El Niño

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días 12:00 UTC = 07:00 hora de Perú
                           # (la TSM costera es diaria; los demás pasos no duplican datos)
  workflow_dispatch:        # botón "Run workflow" para ejecutarlo a mano

jobs:
  recolectar:
    runs-on: ubuntu-latest
    env:                    # credenciales tomadas de los secrets del repositorio
      PYTHONUNBUFFERED: "1"   # muestra los mensajes en orden y en el momento
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      BQ_PROYECTO: ${{ secrets.BQ_PROYECTO }}
      # Nombres configurables desde Settings > Secrets and variables > Actions > Variables
      # (si la variable no existe, se usa el valor por defecto)
      BQ_DATASET: ${{ vars.BQ_DATASET || 'monitoreo_nino' }}
      BQ_TABLA_ICEN: ${{ vars.BQ_TABLA_ICEN || 'icen' }}
      BQ_TABLA_SEMANAL: ${{ vars.BQ_TABLA_SEMANAL || 'nino_semanal' }}
      BQ_TABLA_RONI: ${{ vars.BQ_TABLA_RONI || 'roni' }}
      BQ_TABLA_TSM: ${{ vars.BQ_TABLA_TSM || 'tsm_costera' }}
      BQ_TABLA_TSM_CLIMA: ${{ vars.BQ_TABLA_TSM_CLIMA || 'tsm_costera_clima' }}
      BQ_TABLA_LLUVIA: ${{ vars.BQ_TABLA_LLUVIA || 'lluvia_zonas' }}
      BQ_TABLA_LLUVIA_PUNTOS: ${{ vars.BQ_TABLA_LLUVIA_PUNTOS || 'lluvia_puntos' }}
      BQ_TABLA_LLUVIA_UMBRALES: ${{ vars.BQ_TABLA_LLUVIA_UMBRALES || 'lluvia_umbrales' }}
      BQ_TABLA_EVENTOS: ${{ vars.BQ_TABLA_EVENTOS || 'eventos_historicos' }}
      BQ_TABLA_LLUVIA_SAT: ${{ vars.BQ_TABLA_LLUVIA_SAT || 'lluvia_satelite' }}
      BQ_TABLA_LLUVIA_CONTRASTE: ${{ vars.BQ_TABLA_LLUVIA_CONTRASTE || 'lluvia_contraste' }}
      BQ_TABLA_EVENTOS_SAT: ${{ vars.BQ_TABLA_EVENTOS_SAT || 'eventos_satelite' }}
      EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
      EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}   # vacío = plan gratuito (prueba)
    steps:
      - uses: actions/checkout@v5          # 1. descarga tu código
      - uses: actions/setup-python@v6      # 2. instala Python
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt   # 3. instala librerías
      - name: ICEN (variable 1)                # 4. ejecuta cada recolector
        run: python recolectores/icen.py --validar
      - name: Regiones Niño semanal + RONI (variable 2)
        if: always()                         # corre aunque falle el paso anterior
        run: python recolectores/nino_semanal_roni.py --validar
      - name: TSM costera diaria (variable 3)
        if: always()
        timeout-minutes: 90                  # la primera ejecución descarga desde 1991
        run: python recolectores/tsm_costera.py --validar
      - name: Lluvia por zonas - modelo (variable 5a)
        if: always()
        timeout-minutes: 30
        run: python recolectores/lluvia.py --validar
      - name: Lluvia por satélite NASA IMERG (variable 5b)
        if: always()
        timeout-minutes: 60                  # la primera vez también procesa los eventos históricos
        run: python recolectores/lluvia_satelite.py --validar
      # Aquí iremos agregando un paso por cada nueva variable
